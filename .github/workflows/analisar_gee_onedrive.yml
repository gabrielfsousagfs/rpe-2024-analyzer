name: Analisar Inventários GEE Onedrive

on:
  workflow_dispatch:
    inputs:
      onedrive_zip_url:
        description: "Link de compartilhamento do ZIP no OneDrive (precisa estar como 'Qualquer pessoa com o link')"
        required: true
        type: string
      max_paginas:
        description: "Máximo de páginas por PDF a analisar (0 = todas)"
        required: false
        default: "0"
        type: string

jobs:
  analisar:
    name: Baixar PDFs e Analisar
    runs-on: ubuntu-latest
    timeout-minutes: 180   # 3h — ajuste se necessário

    steps:
      # ── 1. Checkout do repositório ─────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Python ──────────────────────────────────────────────────────────
      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ── 3. Dependências ────────────────────────────────────────────────────
      - name: Instalar dependências
        run: pip install -r requirements.txt

      # ── 4. Baixar ZIP do OneDrive (link público, sem autenticação) ─────────
      - name: Baixar ZIP dos PDFs do OneDrive
        timeout-minutes: 10
        env:
          ONEDRIVE_ZIP_URL: ${{ github.event.inputs.onedrive_zip_url }}
        run: |
          echo "📥 Baixando arquivo do OneDrive..."
          pip install requests
          python - <<'EOF'
          import os
          import sys
          from urllib.parse import urlsplit, urlunsplit, parse_qsl, urlencode
          import requests

          url = os.environ["ONEDRIVE_ZIP_URL"]

          session = requests.Session()
          session.headers.update({"User-Agent": "Mozilla/5.0"})

          def with_download_param(u: str) -> str:
              """Adiciona/força download=1 na URL, preservando os demais parâmetros."""
              parts = urlsplit(u)
              query = dict(parse_qsl(parts.query))
              query["download"] = "1"
              return urlunsplit(
                  (parts.scheme, parts.netloc, parts.path, urlencode(query), parts.fragment)
              )

          # Timeout em segundos: (tempo p/ conectar, tempo p/ receber dados entre bytes)
          TIMEOUT = (15, 60)

          def tentar_baixar(u: str):
              """Tenta baixar o arquivo a partir da URL informada.
              Retorna a resposta (aberta, stream=True) se vier binário, ou None se vier HTML."""
              try:
                  r = session.get(u, allow_redirects=True, stream=True, timeout=TIMEOUT)
              except requests.exceptions.RequestException as e:
                  print(f"⚠️  Falha de rede/timeout ao tentar {u}: {e}")
                  return None
              content_type = r.headers.get("Content-Type", "")
              if r.ok and "text/html" not in content_type:
                  return r
              r.close()
              return None

          # Tentativa 1: aplica download=1 direto na URL original (sem resolver redirect antes)
          resposta = tentar_baixar(with_download_param(url))

          # Tentativa 2 (fallback): resolve redirecionamentos primeiro (ex.: links curtos 1drv.ms)
          # e só então aplica download=1 na URL final
          if resposta is None:
              try:
                  resolvida = session.get(url, allow_redirects=True, stream=True, timeout=TIMEOUT)
                  final_url = resolvida.url
                  resolvida.close()
                  resposta = tentar_baixar(with_download_param(final_url))
              except requests.exceptions.RequestException as e:
                  print(f"⚠️  Falha de rede/timeout ao resolver redirecionamentos: {e}")

          if resposta is None:
              # Diagnóstico: mostra o que está vindo, para investigarmos a causa
              try:
                  diag = session.get(with_download_param(url), allow_redirects=True, timeout=TIMEOUT)
                  print(f"❌ Não foi possível baixar diretamente (status {diag.status_code}).")
                  print(f"URL final após redirecionamentos: {diag.url}")
                  print(f"Content-Type: {diag.headers.get('Content-Type')}")
                  print("Primeiros 500 caracteres da resposta:")
                  print(diag.text[:500])
              except requests.exceptions.RequestException as e:
                  print(f"❌ Não foi possível baixar o arquivo: falha de rede/timeout ({e}).")
              print("\nVerifique se o link está como 'Qualquer pessoa com o link' e se o tenant")
              print("não exige verificação adicional para acesso anônimo (nesse caso, use a")
              print("versão do workflow com Microsoft Graph API / App Registration).")
              print("\nSe o erro foi de timeout, pode ser throttling da Microsoft para acessos")
              print("automatizados repetidos ao mesmo link — aguarde alguns minutos e tente de novo.")
              sys.exit(1)

          with resposta as r:
              with open("pdfs.zip", "wb") as f:
                  for chunk in r.iter_content(chunk_size=8192):
                      f.write(chunk)

          print("✅ Download concluído.")
          EOF

      # ── 5. Extrair ZIP ─────────────────────────────────────────────────────
      - name: Extrair PDFs
        run: |
          echo "📦 Extraindo ZIP..."
          mkdir -p pdfs
          unzip -q pdfs.zip -d pdfs_raw
          # Corrige permissões: ZIPs gerados pelo SharePoint/OneDrive às vezes
          # extraem pastas sem permissão de escrita para o usuário atual, o
          # que impede o 'mv' abaixo (rename exige escrita na pasta de origem)
          chmod -R u+rwX pdfs_raw
          # Move todos os PDFs encontrados (independente de subpastas) para ./pdfs
          find pdfs_raw -name "*.pdf" -exec mv {} pdfs/ \;
          PDF_COUNT=$(find pdfs -name "*.pdf" | wc -l)
          echo "📄 PDFs extraídos: $PDF_COUNT"
          echo "PDF_COUNT=$PDF_COUNT" >> $GITHUB_ENV

      # ── 6. Executar análise ────────────────────────────────────────────────
      - name: Executar análise
        run: |
          MAX_PAG="${{ github.event.inputs.max_paginas }}"
          DATA=$(date +"%Y-%m-%d")
          SAIDA="resultados_gee_${DATA}.xlsx"

          if [ "$MAX_PAG" = "0" ]; then
            echo "🔍 Analisando todas as páginas de $PDF_COUNT PDFs..."
            python analisar_inventarios_gee.py --pasta pdfs --saida "$SAIDA"
          else
            echo "🔍 Analisando até $MAX_PAG páginas por PDF ($PDF_COUNT PDFs)..."
            python analisar_inventarios_gee.py --pasta pdfs --saida "$SAIDA" --paginas "$MAX_PAG"
          fi

          echo "SAIDA=$SAIDA" >> $GITHUB_ENV

      # ── 7. Salvar planilha como artefato ───────────────────────────────────
      - name: Salvar planilha de resultados
        uses: actions/upload-artifact@v4
        with:
          name: resultados-gee-${{ github.run_number }}
          path: ${{ env.SAIDA }}
          retention-days: 90   # mantém por 90 dias; ajuste se quiser

      # ── 8. Resumo no log do workflow ───────────────────────────────────────
      - name: Exibir resumo
        run: |
          echo "## ✅ Análise concluída" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| PDFs analisados | $PDF_COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "| Arquivo gerado | \`$SAIDA\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Disponível em | Actions → Artifacts → resultados-gee-${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
